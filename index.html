<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0d19">
  <title>ASTRAL CROWN — 星冠の継承者</title>
  <link rel="stylesheet" href="./src/style.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <a class="brand" href="#"><span class="brand-mark">✧</span><span>ASTRAL<br><b>CROWN</b><small>星冠の継承者</small></span></a>
      <div class="side-label">YOUR NEXT LEGEND</div>
      <nav aria-label="メインメニュー">
        <button data-page="home" class="active"><span>⌂</span>拠点 <small>HOME</small></button>
        <button data-page="summon"><span>✧</span>星の召喚 <small>SUMMON</small></button>
        <button data-page="collection"><span>▥</span>継承図鑑 <small>COLLECTION</small></button>
        <button data-page="arena"><span>⚔</span>闘技場 <small>ARENA</small></button>
        <button data-page="shop"><span>◇</span>星晶ショップ <small>SHOP</small></button>
      </nav>
      <div class="side-bottom"><span class="status-dot"></span> PLAYABLE PROTOTYPE <p>追加課金のない、<br>果てしない召喚の旅。</p><a href="./docs/requirements.md" target="_blank">要件定義を読む ↗</a></div>
    </aside>
    <div class="workspace">
      <header>
        <div class="season" id="season"></div>
        <div class="wallet"><div><small>おこづかい <em>ゲーム内</em></small><strong id="cash"></strong></div><div><small>✧ 星晶石</small><strong id="gems"></strong></div><div><small>◈ 育成素材</small><strong id="dust"></strong></div></div>
        <button class="icon-button" id="settings" aria-label="設定">⚙</button>
      </header>
      <main id="main"></main>
      <footer><span>ASTRAL CROWN · PLAYABLE PROTOTYPE 0.1</span><span id="save-status">自動保存</span></footer>
    </div>
  </div>
  <dialog id="modal"><div id="modal-content"></div></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <input id="import-file" type="file" accept=".json,application/json" hidden>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
